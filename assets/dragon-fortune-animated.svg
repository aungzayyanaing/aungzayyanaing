<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Animated dragon and fortune banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a0f0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#bg)" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2"/>

  <!-- twinkling stars -->
  <g fill="#fbbf24">
    <circle cx="220" cy="45" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="48" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="32" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="240" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="242" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- swinging lanterns -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 90 18;5 90 18;-5 90 18" dur="4s" repeatCount="indefinite"/>
      <line x1="90" y1="18" x2="90" y2="55" stroke="#fbbf24" stroke-width="2"/>
      <rect x="78" y="55" width="24" height="8" rx="2" fill="#fbbf24"/>
      <ellipse cx="90" cy="95" rx="30" ry="38" fill="url(#red)" stroke="#fbbf24" stroke-width="2"/>
      <ellipse cx="90" cy="95" rx="12" ry="30" fill="#ef4444" opacity="0.55"/>
      <rect x="80" y="130" width="20" height="8" rx="2" fill="#fbbf24"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 910 18;-5 910 18;5 910 18" dur="4.6s" repeatCount="indefinite"/>
      <line x1="910" y1="18" x2="910" y2="55" stroke="#fbbf24" stroke-width="2"/>
      <rect x="898" y="55" width="24" height="8" rx="2" fill="#fbbf24"/>
      <ellipse cx="910" cy="95" rx="30" ry="38" fill="url(#red)" stroke="#fbbf24" stroke-width="2"/>
      <ellipse cx="910" cy="95" rx="12" ry="30" fill="#ef4444" opacity="0.55"/>
      <rect x="900" y="130" width="20" height="8" rx="2" fill="#fbbf24"/>
    </g>
  </g>

  <!-- dragon: gold serpentine body, gently undulating -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" repeatCount="indefinite"/>
    <path d="M 150 190 C 250 90, 350 260, 460 160 C 550 80, 650 240, 760 160 C 830 110, 880 190, 930 150" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 150 190 C 250 90, 350 260, 460 160 C 550 80, 650 240, 760 160 C 830 110, 880 190, 930 150" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="160" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- dragon head -->
    <g transform="translate(930 150)">
      <circle r="22" fill="#ef4444" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="7" cy="-6" r="3.5" fill="#fbbf24"/>
      <path d="M 18 -18 Q 28 -30 34 -26" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M 18 18 Q 28 30 34 26" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M -18 -8 Q -30 -14 -36 -10" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- tail fin -->
    <path d="M 150 190 L 128 172 L 138 196 Z" fill="#ef4444" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- hong pao (red envelopes) bobbing -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="250" y="185" width="62" height="72" rx="6" fill="#b91c1c" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="258" y="193" width="46" height="56" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="281" y="232" font-family="serif" font-size="34" fill="#fbbf24" text-anchor="middle">福</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -6;0 4;0 -6" dur="3.8s" repeatCount="indefinite"/>
      <rect x="680" y="185" width="62" height="72" rx="6" fill="#b91c1c" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="688" y="193" width="46" height="56" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="711" y="232" font-family="serif" font-size="34" fill="#fbbf24" text-anchor="middle">福</text>
    </g>
  </g>

  <text x="500" y="52" font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#fbbf24" text-anchor="middle">DRAGON &amp; FORTUNE</text>
</svg>

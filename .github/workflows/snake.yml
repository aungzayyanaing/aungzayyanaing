name: Generate snake animation
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set snake colour by Myanmar weekday
        run: |
          DAY=$(TZ=Asia/Rangoon date +%u)
          if [ "$DAY" = "6" ] || [ "$DAY" = "7" ]; then
            echo "SNAKE_COLOR=%23ef4444" >> "$GITHUB_ENV"
            echo "SNAKE_DOTS=%2330363d,%237f1d1d,%23991b1b,%23dc2626,%23ef4444" >> "$GITHUB_ENV"
          else
            echo "SNAKE_COLOR=%233b82f6" >> "$GITHUB_ENV"
            echo "SNAKE_DOTS=%2330363d,%231e3a8a,%231d4ed8,%232563eb,%233b82f6" >> "$GITHUB_ENV"
          fi
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: aungzayyanaing
          outputs: |
            dist/github-snake.svg?color_snake=${{ env.SNAKE_COLOR }}&color_dots=${{ env.SNAKE_DOTS }}
            dist/github-snake-dark.svg?color_snake=${{ env.SNAKE_COLOR }}&color_dots=${{ env.SNAKE_DOTS }}
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
